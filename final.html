<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="preload" href="love.mp3" as="audio">
<link rel="preload" href="finalbg.mp3" as="audio">

<title>Forever 💜</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  height:100%;
  overflow-x:hidden;
}

body{
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:center;
  font-family:'Segoe UI',sans-serif;
  text-align:center;
  color:white;
  background:linear-gradient(135deg,#020024,#090979,#4b0082,#7b2cbf);
  transition:opacity 2s ease;
  padding:30px 15px 60px;
}

.star{
  position:fixed;
  top:-10px;
  width:2px;
  height:80px;
  background:linear-gradient(white,transparent);
  transform:rotate(45deg);
  animation:fallStar linear forwards;
  opacity:.8;
  z-index:0;
}

@keyframes fallStar{
  0%{transform:translateY(-100px) translateX(0) rotate(45deg);}
  100%{transform:translateY(110vh) translateX(-200px) rotate(45deg);opacity:0;}
}

.float-heart{
  position:fixed;
  font-size:22px;
  animation:floatUp 10s linear infinite;
  opacity:.6;
  z-index:0;
}

@keyframes floatUp{
  0%{transform:translateY(100vh);opacity:0;}
  50%{opacity:1;}
  100%{transform:translateY(-10vh);opacity:0;}
}

.fade-layer{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  opacity:0;
  transition:opacity 2s ease;
  pointer-events:none;
  z-index:5;
}

.fade-layer.show{
  opacity:.85;
}

.main{
  display:flex;
  flex-direction:column;
  align-items:center;
  z-index:2;
  width:100%;
  max-width:950px;
}

h1{
  font-size:clamp(28px,7vw,48px);
  margin-bottom:20px;
  text-shadow:0 0 10px #9d4edd;
}

p{
  font-size:clamp(16px,4vw,22px);
  max-width:90%;
  line-height:1.7;
  margin-bottom:10px;
}

.video-section{
  width:100%;
  max-width:760px;
  margin-top:28px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
}

.video-box{
  width:100%;
  aspect-ratio:16/9;
  border-radius:22px;
  overflow:hidden;
  background:rgba(255,255,255,.08);
  box-shadow:0 0 25px rgba(157,78,221,.35);
  border:1px solid rgba(255,255,255,.12);
  position:relative;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  opacity:0;
  transition:opacity 2s ease, transform 6s ease;
  transform:scale(1.03);
  background:#000;
}

video.show{
  opacity:1;
  transform:scale(1);
}

.video-caption{
  font-size:clamp(14px,3.5vw,18px);
  color:#f5eaff;
  opacity:.9;
  min-height:24px;
}

button{
  padding:14px 32px;
  margin-top:25px;
  font-size:18px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  background:linear-gradient(45deg,#4ea8de,#9d4edd);
  color:white;
  box-shadow:0 0 12px rgba(150,100,255,0.6);
  transition:.2s;
}

button:hover{
  transform:scale(1.05);
}

.popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(.9);
  background:#111;
  padding:28px 30px;
  border-radius:15px;
  font-size:17px;
  display:none;
  opacity:0;
  box-shadow:0 0 25px #9d4edd;
  max-width:85%;
  line-height:1.6;
  transition:.4s;
  z-index:7;
}

.popup.show{
  display:block;
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

.heart{
  position:absolute;
  font-size:28px;
  animation:explode 1.6s ease forwards;
  pointer-events:none;
  z-index:6;
}

@keyframes explode{
  0%{
    transform:translate(0,0) scale(1);
    opacity:1;
  }
  100%{
    transform:translate(var(--x),var(--y)) scale(1.4);
    opacity:0;
  }
}

.final-message{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(.5);
  text-align:center;
  opacity:0;
  transition:1.5s;
  z-index:8;
}

.final-message.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

.final-message h2{
  font-size:clamp(36px,8vw,70px);
  text-shadow:
  0 0 10px #fff,
  0 0 20px #9d4edd,
  0 0 40px #7b2cbf;
}

.final-message p{
  font-size:clamp(22px,5vw,32px);
  margin-top:10px;
}
</style>
</head>

<body>

<div class="fade-layer" id="fadeLayer"></div>

<audio id="bgMusic" preload="auto" loop>
  <source src="love.mp3" type="audio/mpeg">
</audio>

<audio id="videoMusic" preload="auto" loop>
  <source src="finalbg.mp3" type="audio/mpeg">
</audio>

<div class="main" id="mainContent">
  <h1>Thank You 💜 My Love</h1>
  <p id="typing"></p>

  <div class="video-section">
    <div class="video-box">
      <video id="memoryVideo" muted playsinline preload="auto"></video>
    </div>
    <div class="video-caption" id="videoCaption">Best moments with you 💜</div>
  </div>

  <button onclick="foreverClick()">
    Forever 💙
  </button>
</div>

<div class="popup" id="popupMessage">
  This message will be erased in 3 hours…
  <br><br>
  Unna naan romba special ah paakuren.
  Nee en life la vandhadhu enakku romba periya happiness.
  <br><br>
  Maybe this message will disappear…
  but my care for you will never disappear 💜
</div>

<div class="final-message" id="finalReveal">
  <h2>SUBHA 💜 ARUL</h2>
  <p>Forever</p>
</div>

<script>
const text = "Maybe this message will disappear… but my care for you will never disappear ❤️ Tap to Play";
let i = 0;

function typeText(){
  if(i < text.length){
    document.getElementById("typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(typeText,45);
  }
}
typeText();

function createStar(){
  const star = document.createElement("div");
  star.className = "star";
  star.style.left = Math.random()*100 + "vw";
  star.style.animationDuration = (Math.random()*3+2) + "s";
  document.body.appendChild(star);
  setTimeout(()=>star.remove(),5000);
}
setInterval(createStar,700);

function floatHearts(){
  const heart = document.createElement("div");
  heart.className = "float-heart";
  heart.innerHTML = "💜";
  heart.style.left = Math.random()*100 + "vw";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),10000);
}
setInterval(floatHearts,3000);

const music = document.getElementById("bgMusic");
const videoMusic = document.getElementById("videoMusic");
const memoryVideo = document.getElementById("memoryVideo");
const videoCaption = document.getElementById("videoCaption");

music.volume = 0.5;
videoMusic.volume = 0.45;

document.body.addEventListener("click", () => {
  music.play().catch(()=>{});
  startVideoSequence();
}, { once:true });

const videoList = [
  { src:"slomo/IE (1).mp4", caption:"Our sweet beginning 💜" },
  { src:"slomo/IE (2).mp4", caption:"A little moment, a big memory ✨" },
  { src:"slomo/IE (3).mp4", caption:"Little smiles, big memories ✨" },
  { src:"slomo/IE (4).mp4", caption:"You made this moment beautiful 💖" },
  { src:"slomo/IE (5).mp4", caption:"One more memory to keep forever 💜" },
  { src:"slomo/IE (6).mp4", caption:"My favorite part of the day 💙" },
  { src:"slomo/IE (7).mp4", caption:"A soft moment full of love 🌸" },
  { src:"slomo/IE (8).mp4", caption:"Every frame feels special ✨" },
  { src:"slomo/IE (9).mp4", caption:"You are my sweetest memory 💕" },
  { src:"slomo/IE (10).mp4", caption:"This smile stays in my heart 💜" },
  { src:"slomo/IE (11).mp4", caption:"Love in the smallest moments 🌙" },
  { src:"slomo/IE (12).mp4", caption:"A memory I never want to lose 💖" },
  { src:"slomo/IE (13).mp4", caption:"Still falling for you everyday 💜" },
  { src:"slomo/IE (14).mp4", caption:"You made ordinary moments magical ✨" },
  { src:"slomo/IE (15).mp4", caption:"A beautiful second, forever mine 💙" },
  { src:"slomo/IE (16).mp4", caption:"You are the peace in my heart 💜" },
  { src:"slomo/IE (17).mp4", caption:"This memory still feels alive 🌸" },
  { src:"slomo/IE (18).mp4", caption:"Every look of yours is special 💕" },
  { src:"slomo/IE (19).mp4", caption:"The kind of moment I replay forever ✨" },
  { src:"slomo/IE (20).mp4", caption:"A soft piece of us, captured 💜" },
  { src:"slomo/IE (21).mp4", caption:"My heart smiles at this memory 💖" },
  { src:"slomo/IE (22).mp4", caption:"One clip, so many feelings 💙" },
  { src:"slomo/IE (23).mp4", caption:"The sweetness of us in one frame 🌙" },
  { src:"slomo/IE (24).mp4", caption:"This moment will stay forever 💜" },
  { src:"slomo/IE (25).mp4", caption:"Love looks beautiful on you ✨" },
  { src:"slomo/IE (26).mp4", caption:"A memory wrapped in love 💕" },
  { src:"slomo/IE (27).mp4", caption:"You are my forever favorite 💖" },
  { src:"slomo/IE (28).mp4", caption:"Another little memory, another big smile 💜" },
  { src:"slomo/IE (29).mp4", caption:"My world feels softer with you 🌸" },
  { src:"slomo/IE (30).mp4", caption:"This is what love feels like 💙" },
  { src:"slomo/IE (31).mp4", caption:"A special memory of my special person 💜" },
  { src:"slomo/IE (32).mp4", caption:"Forever starts with moments like this ✨" }
];

let currentVideoIndex = 0;
let videoStarted = false;
let nextTimer = null;
let fadeTimer = null;

function startVideoSequence(){
  if(videoStarted) return;
  videoStarted = true;
  playMemoryClip(currentVideoIndex);
}

function playMemoryClip(index){
  clearTimeout(nextTimer);
  clearTimeout(fadeTimer);

  const clip = videoList[index];
  if(!clip) return;

  memoryVideo.classList.remove("show");
  memoryVideo.pause();

  videoCaption.innerHTML = clip.caption;
  memoryVideo.src = clip.src;
  memoryVideo.muted = true;
  memoryVideo.playsInline = true;
  memoryVideo.playbackRate = 0.85;
  memoryVideo.load();

  memoryVideo.onloadedmetadata = () => {
    let clipDuration = memoryVideo.duration;

    if(!clipDuration || isNaN(clipDuration)){
      clipDuration = 6;
    }

    const playFor = Math.min(clipDuration, 6.5);
    memoryVideo.currentTime = 0;

    memoryVideo.play().then(() => {
      requestAnimationFrame(() => {
        memoryVideo.classList.add("show");
      });
    }).catch(() => {});

    fadeTimer = setTimeout(() => {
      memoryVideo.classList.remove("show");
    }, Math.max((playFor * 1000) - 1800, 2000));

    nextTimer = setTimeout(() => {
      memoryVideo.pause();
      currentVideoIndex++;

      if(currentVideoIndex >= videoList.length){
        currentVideoIndex = 0;
      }

      playMemoryClip(currentVideoIndex);
    }, playFor * 1000);
  };

  memoryVideo.onerror = () => {
    console.log("Error loading:", clip.src);
    currentVideoIndex++;

    if(currentVideoIndex >= videoList.length){
      currentVideoIndex = 0;
    }

    playMemoryClip(currentVideoIndex);
  };
}

function foreverClick(){
  loveExplosion();

  const popup = document.getElementById("popupMessage");
  popup.classList.add("show");

  fadeAudio(music, 1200, () => {
    music.pause();
    music.currentTime = 0;
    videoMusic.play().catch(()=>{});
  });

  setTimeout(() => {
    popup.classList.remove("show");
    document.getElementById("mainContent").style.display = "none";
    document.getElementById("fadeLayer").classList.add("show");
    showFinal();
  }, 5000);
}

function loveExplosion(){
  for(let i=0;i<45;i++){
    const heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.className = "heart";
    heart.style.left = "50%";
    heart.style.top = "50%";
    heart.style.setProperty("--x",(Math.random()*900-450)+"px");
    heart.style.setProperty("--y",(Math.random()*900-450)+"px");
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),1600);
  }
}

function fadeAudio(audio, intervalTime = 200, callback){
  const fade = setInterval(() => {
    if(audio.volume > 0.03){
      audio.volume -= 0.03;
    }else{
      audio.volume = 0;
      clearInterval(fade);
      if(callback) callback();
    }
  }, intervalTime);
}

function showFinal(){
  document.getElementById("finalReveal").classList.add("show");

  setTimeout(() => {
    fadeAudio(videoMusic, 250, () => {
      videoMusic.pause();
      videoMusic.currentTime = 0;
    });
  }, 3500);

  setTimeout(() => {
    document.body.style.opacity = "0";
  }, 8000);
}
</script>

</body>
</html>
